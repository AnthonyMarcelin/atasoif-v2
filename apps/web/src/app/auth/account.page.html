<section class="auth-page">
  <div class="auth-page__inner">
    <h1 class="auth-title">Moi</h1>
    <p class="auth-lead">Ton espace perso. Profil et session arriveront juste après l'auth.</p>

    @if (!loggedOut()) {
      <div class="auth-empty" role="status">
        <div class="auth-empty__mark" aria-hidden="true">
          <div class="auth-empty__mark-fill"><span></span></div>
        </div>
        <p class="auth-lead">
          Tu n'as pas encore de session branchée. Tu peux déjà tester la sortie de compte.
        </p>
        <div class="auth-actions">
          <button class="auth-btn auth-btn--primary" type="button" (click)="logout()">
            Se déconnecter
          </button>
          <a class="auth-btn auth-btn--ghost" routerLink="/auth/login">Aller à la connexion</a>
        </div>
      </div>
    } @else {
      <div class="auth-empty" role="status">
        <p class="auth-status auth-status--ok">Tu es sorti de ta cave. À tout de suite.</p>
        <div class="auth-actions">
          <a class="auth-btn auth-btn--primary" routerLink="/auth/login">Se reconnecter</a>
          <a class="auth-btn auth-btn--secondary" routerLink="/auth/register">Créer une cave</a>
        </div>
      </div>
    }
  </div>
</section>
