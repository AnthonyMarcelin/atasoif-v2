# Local full stack (API + DB in Docker)
# Usage: pnpm docker:dev

services:
  postgres:
    ports:
      - "5432:5432"

  api:
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      DB_HOST: postgres
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "3000:3000"
