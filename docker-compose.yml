# Shared base — use with docker-compose.dev.yml or docker-compose.prod.yml
#
# Dev:  bun run docker:dev
# Prod: bun run docker:prod

name: atasoif

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atasoif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atasoif}
      POSTGRES_DB: ${POSTGRES_DB:-atasoif_v2}
    volumes:
      - atasoif_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atasoif} -d ${POSTGRES_DB:-atasoif_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-atasoif}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-atasoif}
      DB_DATABASE: ${POSTGRES_DB:-atasoif_v2}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-À ta soif}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@atasoif.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      OFF_API_BASE_URL: ${OFF_API_BASE_URL:-https://world.openfoodfacts.org}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-Atasoif/0.1 (hello@atasoif.local)}
      UPCITEMDB_ENABLED: ${UPCITEMDB_ENABLED:-true}
      UPCITEMDB_API_BASE_URL: ${UPCITEMDB_API_BASE_URL:-https://api.upcitemdb.com/prod/trial}
      UPCITEMDB_USER_KEY: ${UPCITEMDB_USER_KEY:-}
      UPCITEMDB_KEY_TYPE: ${UPCITEMDB_KEY_TYPE:-3scale}
      CATALOG_NURSE_DAILY_LIMIT: ${CATALOG_NURSE_DAILY_LIMIT:-100}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  atasoif_pg:
