# OVH / production-like stack
# Usage: bun run docker:prod
# Requires a real .env (never commit secrets).
# Postgres is not published on the host — only reachable on the compose network.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atasoif_v2}

  api:
    environment:
      NODE_ENV: production
      # Do not auto-migrate prod-like stacks (protect live data). Apply schema manually:
      # docker compose exec api node ace migration:run --force
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-atasoif_v2}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "${API_PORT:-3000}:3000"
    restart: always
