packages:
  - "apps/web"
  - "packages/*"

strictDepBuilds: true

allowBuilds:
  "@parcel/watcher": true
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: set this to true or false
  unrs-resolver: true
