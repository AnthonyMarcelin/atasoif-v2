# CI for PRs and pushes to dev/main. On green push to main, publish SHA images
# and deploy only the services that changed (see deploy-prod.yml).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  db-safety:
    name: Prod DB safety grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on destructive DB patterns in deploy paths
        run: |
          set -euo pipefail
          # Assemble patterns so this workflow file does not self-match.
          patterns="$(printf '%s|' \
            'migration:''fresh' \
            'db:''wipe' \
            'db:''seed' \
            'synchronize:[[:space:]]*true' \
            'db push --accept-data-loss' \
            'migrate reset')"
          patterns="${patterns}\\bDROP\\b|\\bTRUNCATE\\b"
          paths=(
            apps/api/docker-entrypoint.sh
            Dockerfile
            apps/site/Dockerfile
            docker-compose.yml
            docker-compose.prod.yml
            .github/scripts
          )
          # Workflows except this safety job definition
          while IFS= read -r f; do
            [[ "$f" == .github/workflows/ci.yml ]] && continue
            paths+=("$f")
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          hits="$(rg -n -i -e "$patterns" "${paths[@]}" || true)"
          if [[ -n "$hits" ]]; then
            echo "::error::Destructive DB pattern found in deploy-related paths:"
            echo "$hits"
            exit 1
          fi
          echo "No destructive DB patterns in deploy paths."

  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atasoif
          POSTGRES_PASSWORD: atasoif
          POSTGRES_DB: atasoif_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atasoif -d atasoif_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TZ: UTC
      HOST: 127.0.0.1
      PORT: 3000
      LOG_LEVEL: info
      APP_KEY: ci_only_placeholder_not_for_production_use_32b
      APP_URL: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:4200
      SESSION_DRIVER: memory
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: atasoif
      DB_PASSWORD: atasoif
      DB_DATABASE: atasoif_v2_test
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: Atasoif
      MAIL_FROM_ADDRESS: noreply@atasoif.local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      CORS_ORIGIN: http://localhost:4200
      QUEUE_DRIVER: sync
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      FACEBOOK_CLIENT_ID: ci-facebook-client-id
      FACEBOOK_CLIENT_SECRET: ci-facebook-client-secret
      APPLE_CLIENT_ID: com.atasoif.web
      APPLE_TEAM_ID: CITEAMID
      APPLE_KEY_ID: CIKEYID
      APPLE_PRIVATE_KEY: ci-p8-placeholder-not-a-real-key
      OFF_API_BASE_URL: https://world.openfoodfacts.org
      OFF_USER_AGENT: "Atasoif/0.1 (ci@atasoif.local)"
      UPCITEMDB_ENABLED: "true"
      UPCITEMDB_API_BASE_URL: https://api.upcitemdb.com/prod/trial

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write API env files
        run: |
          set -euo pipefail
          {
            echo 'TZ=UTC'
            echo 'PORT=3000'
            echo 'HOST=127.0.0.1'
            echo 'NODE_ENV=development'
            echo 'LOG_LEVEL=info'
            echo 'APP_KEY=ci_only_placeholder_not_for_production_use_32b'
            echo 'APP_URL=http://127.0.0.1:3000'
            echo 'FRONTEND_URL=http://127.0.0.1:4200'
            echo 'SESSION_DRIVER=memory'
            echo 'DB_HOST=127.0.0.1'
            echo 'DB_PORT=5432'
            echo 'DB_USER=atasoif'
            echo 'DB_PASSWORD=atasoif'
            echo 'DB_DATABASE=atasoif_v2_test'
            echo 'MAIL_MAILER=smtp'
            echo 'MAIL_FROM_NAME=Atasoif'
            echo 'MAIL_FROM_ADDRESS=noreply@atasoif.local'
            echo 'SMTP_HOST=127.0.0.1'
            echo 'SMTP_PORT=1025'
            echo 'CORS_ORIGIN=http://localhost:4200'
            echo 'QUEUE_DRIVER=sync'
            echo 'GOOGLE_CLIENT_ID=ci-google-client-id'
            echo 'GOOGLE_CLIENT_SECRET=ci-google-client-secret'
            echo 'FACEBOOK_CLIENT_ID=ci-facebook-client-id'
            echo 'FACEBOOK_CLIENT_SECRET=ci-facebook-client-secret'
            echo 'APPLE_CLIENT_ID=com.atasoif.web'
            echo 'APPLE_TEAM_ID=CITEAMID'
            echo 'APPLE_KEY_ID=CIKEYID'
            echo 'APPLE_PRIVATE_KEY=ci-p8-placeholder-not-a-real-key'
            echo 'OFF_API_BASE_URL=https://world.openfoodfacts.org'
            echo 'OFF_USER_AGENT=Atasoif/0.1 (ci@atasoif.local)'
            echo 'UPCITEMDB_ENABLED=true'
            echo 'UPCITEMDB_API_BASE_URL=https://api.upcitemdb.com/prod/trial'
          } > apps/api/.env
          cp apps/api/.env apps/api/.env.test

      - name: Build shared
        run: bun run build:shared

      - name: Lint
        run: bun run lint

      - name: Typecheck API
        run: bun --filter @atasoif/api typecheck

      - name: Migrate test database
        run: bun --filter @atasoif/api migration:run

      - name: API tests
        run: bun run test:api

      - name: Build site
        run: bun run build:site
        env:
          PUBLIC_SITE_URL: https://atasoif.fr
          PUBLIC_CTA_MODE: waitlist

  publish:
    name: Publish images and deploy
    needs: [ci, gitleaks, db-safety]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-prod.yml
    with:
      base_sha: ${{ github.event.before }}
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit
